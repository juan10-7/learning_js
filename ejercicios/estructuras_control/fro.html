<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For en javascript</title>
</head>
<body>
    <script>
        // for(inicializacion; condicion; incremento)
        for (i=0; i<5; i++)
        {
            console.log("valor de i: ", i);
        }
    </script>
</body>
</html>
